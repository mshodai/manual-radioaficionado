site_name: Manual de radioaficionado
site_description: Manual libre en español para la autorización de radioaficionado en España
site_url: https://mshodai.github.io/manual-radioaficionado/
repo_url: https://github.com/mshodai/manual-radioaficionado
repo_name: mshodai/manual-radioaficionado
# ESTILO.md y CLAUDE.md viven en la raíz, fuera de docs/, así que no se publican.
# Se excluyen también aquí por si alguna vez se copian dentro de docs/.
exclude_docs: |
  ESTILO.md
  CLAUDE.md

copyright: Texto bajo licencia <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es">CC BY-SA 4.0</a>

theme:
  language: es
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Usar la preferencia del sistema

nav:
  - Inicio: index.md
  - "1. La autorización en España": 01-autorizacion.md
  - "2. Electricidad y electrónica básica": 02-electricidad-electronica.md
  - "3. Seguridad": 03-seguridad.md
  - "4. Teoría de radio": 04-teoria-radio.md
  - "5. Propagación y bandas": 05-propagacion-bandas.md
  - "6. Antenas y líneas de transmisión": 06-antenas-lineas.md
  - "7. Equipos": 07-equipos.md
  - "8. Interferencias": 08-interferencias.md
  - "9. Reglamentación":
      - 09-reglamentacion/index.md
      - "Nivel internacional: la UIT": 09-reglamentacion/internacional.md
      - "Nivel europeo: la CEPT": 09-reglamentacion/europeo.md
      - Nivel español: 09-reglamentacion/espanol.md
  - "10. Operación": 10-operacion.md
  - "11. Telegrafía": 11-telegrafia.md
  - "12. Modos digitales": 12-modos-digitales.md
  - "13. Satélites": 13-satelites.md
  - "14. Escucha y bandas de uso libre": 14-escucha-uso-libre.md
  - "15. Comunicaciones de emergencia":
      - 15-emergencias/index.md
      - Meshtastic (LoRa, no radioafición): 15-emergencias/meshtastic.md
  - "16. Autoevaluación": 16-autoevaluacion.md
  - "17. Glosario": 17-glosario.md
  - "Apéndice A. Proyectos con Arduino y montajes": apendice-a-proyectos.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # mermaid.js carga por su cuenta la copia de Mermaid de vendor/mermaid/, solo
  # en las páginas con diagramas; por eso esa copia no figura en esta lista.
  - javascripts/mermaid.js
  - javascripts/figuras.js
  - javascripts/mathjax.js
  - javascripts/vendor/mathjax/tex-mml-chtml.js
