<title id="t">Eje de frecuencias con la señal deseada en 14,2 MHz, el oscilador local en 23,2 MHz y la frecuencia imagen en 32,2 MHz. Señal e imagen están a 9 MHz del oscilador, una por cada lado, y separadas entre sí 18 MHz.</title>
