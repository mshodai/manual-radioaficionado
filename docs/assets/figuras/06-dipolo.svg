<title id="t">Dipolo de media onda alimentado en el centro. La corriente es máxima en el centro y nula en las puntas; la tensión es mínima en el centro y máxima en las puntas, con signo opuesto en cada una. Por eso la impedancia es baja en el centro, unos 73 ohmios, y muy alta en los extremos.</title>
