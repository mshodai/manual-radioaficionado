<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="t">
<title id="t">Arriba, un coaxial en corte longitudinal. La corriente útil va por el vivo y vuelve por la cara interior de la malla con el mismo valor y sentido opuesto, así que sus campos se anulan fuera del cable: es el modo diferencial. Una tercera corriente, en modo común, circula por la cara exterior de la malla y hace que el cable radie y capte. Abajo, un choque formado por varias espiras de coaxial sobre un toroide de ferrita: la señal útil pasa sin notarlo y la corriente en modo común encuentra una impedancia alta.</title>
<defs>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
  <marker id="flecha-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
  </marker>
  <marker id="flecha-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="150.0" y="110.0" width="540.0" height="80.0" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2"/>
<line x1="150.0" y1="110.0" x2="690.0" y2="110.0" stroke-width="5"/>
<line x1="150.0" y1="190.0" x2="690.0" y2="190.0" stroke-width="5"/>
<line x1="150.0" y1="150.0" x2="690.0" y2="150.0" stroke="#1a1a1a" stroke-width="3"/>
<text x="140.0" y="155.0" font-size="13" text-anchor="end" fill="#1a1a1a" stroke="none" >equipo</text>
<text x="700.0" y="155.0" font-size="13" text-anchor="start" fill="#1a1a1a" stroke="none" >antena</text>
<line x1="260.0" y1="140.0" x2="420.0" y2="140.0" stroke="#1565c0" marker-end="url(#flecha-acc)" stroke-width="2.5"/>
<text x="340.0" y="134.0" font-size="12" text-anchor="middle" fill="#1565c0" stroke="none" >I₁ por el vivo</text>
<line x1="420.0" y1="162.0" x2="260.0" y2="162.0" stroke="#1565c0" marker-end="url(#flecha-acc)" stroke-width="2.5"/>
<text x="340.0" y="182.0" font-size="12" text-anchor="middle" fill="#1565c0" stroke="none" >I₂ por dentro de la malla</text>
<line x1="600.0" y1="208.0" x2="440.0" y2="208.0" stroke="#c62828" marker-end="url(#flecha-alt)" stroke-width="2.5"/>
<text x="520.0" y="228.0" font-size="12" text-anchor="middle" fill="#c62828" stroke="none" >I₃ por fuera de la malla: modo común</text>
<text x="420.0" y="88.0" font-size="13" text-anchor="middle" fill="#1565c0" stroke="none" >Modo diferencial: I₁ = I₂, opuestas; sus campos se anulan fuera del cable</text>
<text x="420.0" y="30.0" font-size="15" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">Corrientes en un coaxial</text>
<line x1="150.0" y1="350.0" x2="330.0" y2="350.0" stroke-width="6"/>
<line x1="510.0" y1="350.0" x2="690.0" y2="350.0" stroke-width="6"/>
<ellipse cx="360.0" cy="350.0" rx="16" ry="34" stroke="#1a1a1a" stroke-width="5"/>
<ellipse cx="390.0" cy="350.0" rx="16" ry="34" stroke="#1a1a1a" stroke-width="5"/>
<ellipse cx="420.0" cy="350.0" rx="16" ry="34" stroke="#1a1a1a" stroke-width="5"/>
<ellipse cx="450.0" cy="350.0" rx="16" ry="34" stroke="#1a1a1a" stroke-width="5"/>
<ellipse cx="480.0" cy="350.0" rx="16" ry="34" stroke="#1a1a1a" stroke-width="5"/>
<rect x="345.0" y="304.0" width="150.0" height="92.0" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="420.0" y="296.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >varias espiras de coaxial sobre un toroide de ferrita</text>
<line x1="250.0" y1="326.0" x2="320.0" y2="326.0" stroke="#1565c0" marker-end="url(#flecha-acc)" stroke-width="2.5"/>
<text x="240.0" y="318.0" font-size="12" text-anchor="end" fill="#1565c0" stroke="none" >la señal útil pasa</text>
<line x1="640.0" y1="374.0" x2="520.0" y2="374.0" stroke="#c62828" marker-end="url(#flecha-alt)" stroke-width="2.5"/>
<line x1="512.0" y1="362.0" x2="528.0" y2="386.0" stroke="#c62828" stroke-width="3"/>
<line x1="512.0" y1="386.0" x2="528.0" y2="362.0" stroke="#c62828" stroke-width="3"/>
<text x="600.0" y="408.0" font-size="12" text-anchor="middle" fill="#c62828" stroke="none" >el modo común encuentra una impedancia alta</text>
<text x="420.0" y="266.0" font-size="14" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">Choque de modo común (balun de corriente)</text>
</g>
</svg>
