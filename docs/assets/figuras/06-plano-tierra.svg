<line x1="190.0" y1="238.0" x2="190.0" y2="340.0" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="196.0" y="356.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >coaxial</text>
<text x="200.0" y="147.0" font-size="14" text-anchor="start" fill="#1565c0" stroke="none" >λ/4</text>
<text x="190.0" y="36.0" font-size="15" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">Radiales horizontales</text>
<text x="190.0" y="60.0" font-size="14" text-anchor="middle" fill="#1a1a1a" stroke="none" >impedancia ≈ 36 Ω</text>
