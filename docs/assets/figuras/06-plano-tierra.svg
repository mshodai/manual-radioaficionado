<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 400" width="710" height="400" role="img" aria-labelledby="t">
<title id="t">Dos antenas verticales de cuarto de onda con cuatro radiales de cuarto de onda. Con los radiales horizontales, la impedancia es de unos 36 ohmios. Si se inclinan unos 45 grados hacia abajo, sube hasta unos 50 ohmios y se puede alimentar directamente con coaxial de 50 ohmios.</title>
