<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t">
<title id="t">Dos señales fuertes en 145,350 y 145,600 megahercios, separadas 250 kilohercios, generan en un elemento no lineal productos de tercer orden en 145,100 y 145,850 megahercios, a la misma separación por fuera de cada una, y productos de quinto orden más débiles en 144,850 y 146,100 megahercios. Los niveles son ilustrativos.</title>
