<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 262" width="660" height="262" role="img" aria-labelledby="t">
<title id="t">Seis bandas de la nomenclatura de la UIT, de LF a SHF, cada una diez veces más alta en frecuencia que la anterior, con su nombre métrico y ejemplos de uso.</title>
<defs>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
  <marker id="flecha-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="30" y="60" width="100" height="60" fill="#e3f2fd" stroke="#1a1a1a"/>
<text x="80.0" y="87.0" font-size="18" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">LF</text>
<text x="80.0" y="108.0" font-size="11.5" text-anchor="middle" fill="#1a1a1a" stroke="none" >30–300 kHz</text>
<text x="80.0" y="145.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >ondas</text>
<text x="80.0" y="161.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >kilométricas</text>
<text x="80.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >onda larga</text>
<rect x="130" y="60" width="100" height="60" fill="#bbdefb" stroke="#1a1a1a"/>
<text x="180.0" y="87.0" font-size="18" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">MF</text>
<text x="180.0" y="108.0" font-size="11.5" text-anchor="middle" fill="#1a1a1a" stroke="none" >300–3000 kHz</text>
<text x="180.0" y="145.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >ondas</text>
<text x="180.0" y="161.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >hectométricas</text>
<text x="180.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >onda media</text>
<text x="180.0" y="206.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >160 m</text>
<rect x="230" y="60" width="100" height="60" fill="#90caf9" stroke="#1a1a1a"/>
<text x="280.0" y="87.0" font-size="18" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">HF</text>
<text x="280.0" y="108.0" font-size="11.5" text-anchor="middle" fill="#1a1a1a" stroke="none" >3–30 MHz</text>
<text x="280.0" y="145.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >ondas</text>
<text x="280.0" y="161.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >decamétricas</text>
<text x="280.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >bandas de 80 a 10 m</text>
<rect x="330" y="60" width="100" height="60" fill="#64b5f6" stroke="#1a1a1a"/>
<text x="380.0" y="87.0" font-size="18" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">VHF</text>
<text x="380.0" y="108.0" font-size="11.5" text-anchor="middle" fill="#1a1a1a" stroke="none" >30–300 MHz</text>
<text x="380.0" y="145.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >ondas</text>
<text x="380.0" y="161.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >métricas</text>
<text x="380.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >radio FM</text>
<text x="380.0" y="206.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >6 m y 2 m</text>
<rect x="430" y="60" width="100" height="60" fill="#42a5f5" stroke="#1a1a1a"/>
<text x="480.0" y="87.0" font-size="18" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">UHF</text>
<text x="480.0" y="108.0" font-size="11.5" text-anchor="middle" fill="#1a1a1a" stroke="none" >300–3000 MHz</text>
<text x="480.0" y="145.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >ondas</text>
<text x="480.0" y="161.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >decimétricas</text>
<text x="480.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >70 cm</text>
<text x="480.0" y="206.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >TDT, móviles</text>
<rect x="530" y="60" width="100" height="60" fill="#1e88e5" stroke="#1a1a1a"/>
<text x="580.0" y="87.0" font-size="18" text-anchor="middle" fill="#1a1a1a" stroke="none" font-weight="600">SHF</text>
<text x="580.0" y="108.0" font-size="11.5" text-anchor="middle" fill="#1a1a1a" stroke="none" >3–30 GHz</text>
<text x="580.0" y="145.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >ondas</text>
<text x="580.0" y="161.0" font-size="12" text-anchor="middle" fill="#1a1a1a" stroke="none" >centimétricas</text>
<text x="580.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >satélite</text>
<text x="580.0" y="206.0" font-size="11.5" text-anchor="middle" fill="#1565c0" stroke="none" >3 cm</text>
<line x1="30.0" y1="35.0" x2="630.0" y2="35.0" stroke="#1a1a1a" marker-end="url(#flecha)"/><text x="30.0" y="28.0" font-size="13" text-anchor="start" fill="#1a1a1a" stroke="none" >frecuencia (escala logarítmica: cada casilla, ×10)</text>
<line x1="630.0" y1="228.0" x2="30.0" y2="228.0" stroke="#1a1a1a" marker-end="url(#flecha)"/><text x="630.0" y="248.0" font-size="13" text-anchor="end" fill="#1a1a1a" stroke="none" >longitud de onda</text>
</g>
</svg>
