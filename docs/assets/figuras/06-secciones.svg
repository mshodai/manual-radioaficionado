<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
<title id="t">Sección de un cable coaxial y de una línea paralela. El coaxial tiene un conductor central de diámetro d, un dieléctrico, una malla de diámetro interior D y una cubierta. La línea paralela tiene dos conductores de diámetro d separados una distancia S entre centros.</title>
