<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-labelledby="t">
<title id="t">Dos tramos de línea de un cuarto de longitud de onda eléctrica. Si el extremo está en cortocircuito, en la entrada se ve un circuito abierto, de impedancia muy alta, como un circuito resonante paralelo. Si el extremo está abierto, en la entrada se ve un cortocircuito, como un circuito resonante serie. Un tramo de media onda repite en la entrada lo que hay en el extremo.</title>
<defs>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
  <marker id="flecha-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<g fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<line x1="110.0" y1="75.0" x2="430.0" y2="75.0" stroke-width="2.5"/>
<line x1="110.0" y1="115.0" x2="430.0" y2="115.0" stroke-width="2.5"/>
<circle cx="110.0" cy="75.0" r="4.0" fill="#ffffff" stroke="#1a1a1a"/>
<circle cx="110.0" cy="115.0" r="4.0" fill="#ffffff" stroke="#1a1a1a"/>
<line x1="430.0" y1="75.0" x2="430.0" y2="115.0" stroke="#c62828" stroke-width="4"/>
<text x="440.0" y="100.0" font-size="13" text-anchor="start" fill="#c62828" stroke="none" >en corto</text>
<line x1="110.0" y1="61.0" x2="430.0" y2="61.0" stroke="#1a1a1a" marker-start="url(#flecha)" marker-end="url(#flecha)" stroke-width="1.2"/>
<text x="270.0" y="54.0" font-size="13" text-anchor="middle" fill="#1a1a1a" stroke="none" >λ/4 eléctrico</text>
<text x="98.0" y="100.0" font-size="12" text-anchor="end" fill="#1a1a1a" stroke="none" >entrada</text>
<line x1="500.0" y1="95.0" x2="560.0" y2="95.0" stroke="#1565c0" marker-end="url(#flecha-acc)" stroke-width="2"/>
<text x="575.0" y="91.0" font-size="13" text-anchor="start" fill="#1565c0" stroke="none" >equivale a un circuito abierto</text>
<text x="575.0" y="111.0" font-size="12" text-anchor="start" fill="#1565c0" stroke="none" >(impedancia muy alta)</text>
<line x1="110.0" y1="225.0" x2="430.0" y2="225.0" stroke-width="2.5"/>
<line x1="110.0" y1="265.0" x2="430.0" y2="265.0" stroke-width="2.5"/>
<circle cx="110.0" cy="225.0" r="4.0" fill="#ffffff" stroke="#1a1a1a"/>
<circle cx="110.0" cy="265.0" r="4.0" fill="#ffffff" stroke="#1a1a1a"/>
<text x="440.0" y="250.0" font-size="13" text-anchor="start" fill="#c62828" stroke="none" >abierta</text>
<line x1="110.0" y1="211.0" x2="430.0" y2="211.0" stroke="#1a1a1a" marker-start="url(#flecha)" marker-end="url(#flecha)" stroke-width="1.2"/>
<text x="270.0" y="204.0" font-size="13" text-anchor="middle" fill="#1a1a1a" stroke="none" >λ/4 eléctrico</text>
<text x="98.0" y="250.0" font-size="12" text-anchor="end" fill="#1a1a1a" stroke="none" >entrada</text>
<line x1="500.0" y1="245.0" x2="560.0" y2="245.0" stroke="#1565c0" marker-end="url(#flecha-acc)" stroke-width="2"/>
<text x="575.0" y="241.0" font-size="13" text-anchor="start" fill="#1565c0" stroke="none" >equivale a un cortocircuito</text>
<text x="575.0" y="261.0" font-size="12" text-anchor="start" fill="#1565c0" stroke="none" >(impedancia muy baja)</text>
<text x="400.0" y="330.0" font-size="13" text-anchor="middle" fill="#1a1a1a" stroke="none" >Media longitud de onda repite en la entrada lo que hay en el extremo.</text>
</g>
</svg>
