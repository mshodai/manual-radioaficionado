<title id="t">Un emisor lanza rayos hacia la capa F. El más empinado la atraviesa y se pierde en el espacio. Los menos inclinados vuelven a la Tierra: el primero que vuelve marca la distancia de salto, y entre el final de la onda de superficie y ese punto queda la zona de silencio.</title>
