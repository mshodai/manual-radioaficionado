<title id="t">Espectro entre 6,7 y 7,5 megahercios con la banda de 40 metros sombreada. Aparece una fila de rayas separadas 70 kilohercios, los armónicos de una fuente conmutada que trabaja a esa frecuencia; los armónicos 101 y 102 caen en 7,070 y 7,140 megahercios, dentro de la banda. Las rayas son anchas porque la frecuencia de conmutación varía con la carga. Los niveles son ilustrativos.</title>
