<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t">
<title id="t">Espectro de una emisión en 50,2 megahercios. La portadora está a 0 dBc; los armónicos aparecen en 100,4, 150,6 y 200,8 megahercios con niveles decrecientes. El segundo armónico cae dentro de la banda de radiodifusión en FM, de 87,5 a 108 megahercios. Una curva discontinua verde muestra la respuesta de un filtro paso bajo, que deja pasar la portadora; tras el filtro, el segundo armónico baja unos 40 dB más y el tercero queda por debajo de −90 dBc. Los niveles son ilustrativos.</title>
