<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="t">
<title id="t">Amplitud de la tensión a lo largo de una línea de transmisión, normalizada a la onda incidente. Con la carga adaptada, ROE 1, la tensión es la misma en toda la línea. Con ROE 3 oscila entre 1,5 y 0,5. Con el extremo abierto, ROE infinita, oscila entre 2 y 0. Los máximos se repiten cada media longitud de onda.</title>
